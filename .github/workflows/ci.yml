name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^8.38'
            phpunit: '^10.5'
          - php: '8.2'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            testbench: '^11.0'
            phpunit: '^11.5'
          - php: '8.4'
            testbench: '^11.0'
            phpunit: '^11.5'
          - php: '8.5'
            testbench: '^11.0'
            phpunit: '^11.5'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Laravel and PHPUnit versions
        run: >-
          composer update
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "phpunit/phpunit:${{ matrix.phpunit }}"
          --no-interaction
          --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Run test suite
        run: composer test
